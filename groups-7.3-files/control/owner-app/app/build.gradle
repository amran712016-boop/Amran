plugins {
    id 'com.android.application'
}

android {
    namespace 'app.tg.owner'
    compileSdk 35

    defaultConfig {
        applicationId 'app.tg.owner'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            def keystore = System.getenv('COMMENTS_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('COMMENTS_KEYSTORE_PASSWORD')
                keyAlias 'comments'
                keyPassword System.getenv('COMMENTS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('COMMENTS_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
